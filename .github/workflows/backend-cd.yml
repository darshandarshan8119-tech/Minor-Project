name: Backend CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/agrimart-backend

jobs:
  build-and-publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=${{ inputs.environment }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-template:
    name: Deployment hook template
    runs-on: ubuntu-latest
    needs: build-and-publish
    environment: ${{ inputs.environment }}
    steps:
      - name: Wire your host or cloud deploy here
        run: |
          echo "Image pushed: $IMAGE_NAME"
          echo "Add SSH/Kubernetes/Render/Fly/Railway deploy command for ${{ inputs.environment }}."
